<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iraianbu's AI Agent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">

    <aside class="sidebar">
      <div class="brand">
        <h1>Iraianbu's Agent</h1>
        <p class="brand-subtitle">Powered by Gemini Function Calling</p>
      </div>
      <p class="sidebar-hint">Try asking: "What's the weather in Chennai?"</p>
    </aside>

    <main class="main">
      <div id="chat-window" class="chat-window"></div>

      <div class="chat-form">
        <input
          type="text"
          id="user-input"
          placeholder="Ask me anything..."
          autocomplete="off"
          required
        >
        <button type="button" id="send-button">Send</button>
      </div>
    </main>

  </div>

  <script src="script.js"></script>
</body>
</html>
